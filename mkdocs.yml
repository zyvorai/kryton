site_name: Kryton
site_description: Windows virtualization control plane — one stable machine API over demo, dockur, and KubeVirt backends.
site_url: https://zyvorai.github.io/kryton/
repo_url: https://github.com/zyvorai/kryton
repo_name: zyvorai/kryton
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  /README.md
theme:
  name: material
  logo: assets/readme/zyvor-logo.svg
  favicon: assets/readme/zyvor-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features: [navigation.tabs, navigation.sections, navigation.top, navigation.footer, content.code.copy, search.suggest, search.highlight, toc.follow]
plugins: [search]
hooks:
  - docs/overrides/hooks.py
extra_css:
  - stylesheets/apple-glass.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - {name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - tables
  - toc: {permalink: true}
nav:
  - Home: index.md
  - FAQ: FAQ.md
  - Guides:
      - User guide: USER-GUIDE.md
      - Authentication: AUTH.md
      - User readiness: USER.md
  - Deployment:
      - Production deployment: DEPLOYMENT.md
      - Remote deployment: DEPLOY-REMOTE.md
      - KubeVirt Windows VMs: KUBEVIRT.md
      - Dockur lab provider: DOCKUR.md
      - Golden images: GOLDEN-IMAGES.md
      - Storage: STORAGE.md
      - Atlas integration: ATLAS.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - API reference: API.md
      - GA path: GA.md
extra:
  social:
    - {icon: fontawesome/brands/github, link: https://github.com/zyvorai/kryton}
