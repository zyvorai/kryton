replicaCount: 1

image:
  repository: ghcr.io/zyvorai/kryton
  tag: "1.0.0"
  pullPolicy: IfNotPresent

provider: kubevirt
projects: [default]
defaultProject: default
namespacePrefix: ""
imageNamespace: kryton-images

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  clusterWide: true

auth:
  mode: apikey
  existingSecret: kryton-auth
  trustProxy: false
  allowInsecure: false

eventWebhookURL: ""
reconcileInterval: 30s

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 1000m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: false

tolerations: []
affinity: {}
nodeSelector: {}

images:
  - id: windows-server-2025
    name: Windows Server 2025
    version: "2025"
    family: windows-server
    description: Enterprise Windows Server image reference for CDI DataSource provisioning.
    minCpu: 2
    minMemoryMiB: 4096
    defaultDiskGiB: 80
    tags: [server, enterprise]
  - id: windows-server-2022
    name: Windows Server 2022
    version: "2022"
    family: windows-server
    description: Stable Windows Server image for application and infrastructure workloads.
    minCpu: 2
    minMemoryMiB: 4096
    defaultDiskGiB: 80
    tags: [server, lts]
  - id: windows-11-enterprise
    name: Windows 11 Enterprise
    version: 24H2
    family: windows-desktop
    description: Enterprise Windows desktop image for developer and test workspaces.
    minCpu: 4
    minMemoryMiB: 8192
    defaultDiskGiB: 96
    tags: [desktop, developer]
