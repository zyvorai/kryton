name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          CGO_ENABLED=0 go build -o /tmp/krytond ./cmd/krytond
          CGO_ENABLED=0 go build -o /tmp/krytonctl ./cmd/krytonctl
      - name: JS syntax
        run: node --check cmd/krytond/web/app.js
